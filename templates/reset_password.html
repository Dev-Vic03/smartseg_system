<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - SmartSeg</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0F172A;
      --card-bg: #1E293B;
      --accent-color: #6366F1;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .auth-header { text-align: center; margin-bottom: 24px; }
    .auth-header i { font-size: 36px; color: var(--accent-color); margin-bottom: 12px; }
    .auth-header h2 { font-size: 20px; font-weight: 700; }
    .auth-header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .field input {
      width: 100%;
      padding: 10px 12px;
      background: #0F172A;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #FFF;
      font-size: 14px;
      outline: none;
    }
    .field input:focus { border-color: var(--accent-color); }
    .btn {
      width: 100%;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      background: var(--accent-color);
      color: #FFF;
      margin-top: 8px;
    }
    .btn:hover { opacity: 0.9; }
    .flash-messages { margin-bottom: 16px; list-style: none; }
    .flash-item {
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #EF4444;
      color: #FCA5A5;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <i class="fa-solid fa-key"></i>
      <h2>Set New Password</h2>
      <p>Enter your new password below</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flash-messages">
          {% for category, message in messages %}
            <li class="flash-item">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="field">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn">Update Password</button>
    </form>
  </div>

</body>
</html>
