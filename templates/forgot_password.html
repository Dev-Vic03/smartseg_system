<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSeg - Reset Password</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    :root {
      --brand-blue: #2563EB;
      --gradient-bg: linear-gradient(135deg, #2563eb 0%, #1d4ed8 50%, #1e1b4b 100%);
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }
    * { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
        font-family: system-ui, -apple-system, sans-serif; 
    }
    body { 
        background-color: #ffffff; 
        min-height: 100vh; 
        display: flex; 
    }
    .auth-container { 
        display: flex; 
        width: 100vw; 
        min-height: 100vh; 
    }
    .brand-panel { 
        flex: 1; 
        background: var(--gradient-bg); 
        color: #fff; 
        padding: 60px; 
        display: flex; 
        flex-direction: column; 
        justify-content: space-between; 
    }
    .brand-hero-content { 
        max-width: 480px; 
        margin: auto 0; 
    }
    .brand-icon-badge { 
        width: 64px; 
        height: 64px; 
        background: rgba(255, 255, 255, 0.2); 
        border-radius: 16px; 
        display: grid; 
        place-items: center; 
        font-size: 2rem; 
        margin-bottom: 32px; 
    }
    .brand-hero-content h1 { 
        font-size: 3rem; 
        font-weight: 800; 
        line-height: 1.15; 
        margin-bottom: 20px; 
    }

    .form-panel { 
        width: 520px; 
        padding: 60px; 
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
    }
    .brand-logo-text { 
        font-size: 1.5rem; 
        font-weight: 800; 
        color: var(--text-dark); 
        text-decoration: none; 
        margin-bottom: 40px; 
    }
    .form-header h2 { 
        font-size: 1.85rem; 
        font-weight: 800; 
        color: var(--text-dark); 
        margin-bottom: 8px; 
    }
    .subtext { 
        font-size: 0.9rem; 
        color: var(--text-muted); 
        margin-bottom: 24px; 
    }
    
    .form-group { 
        margin-bottom: 20px; 
    }
    .form-group label { 
        display: block; 
        font-size: 0.875rem; 
        font-weight: 600; 
        margin-bottom: 8px; 
    }
    .form-control { 
        width: 100%; 
        padding: 12px 16px; 
        border: 1px solid var(--border-color); 
        border-radius: 8px; 
        font-size: 0.95rem; 
        background: #f8fafc; 
    }
    .btn-submit { 
        width: 100%; 
        padding: 12px; 
        background: #111827; 
        color: #fff; 
        border: none; 
        border-radius: 8px; 
        font-size: 1rem; 
        font-weight: 600; 
        cursor: pointer; 
    }
    .back-link { 
        display: inline-block; 
        margin-top: 20px; 
        color: var(--brand-blue); 
        text-decoration: none; 
        font-weight: 600; 
        text-align: center; 
        width: 100%; }

    @media (max-width: 900px) { 
        .brand-panel { 
            display: none; 
        } 
        .form-panel { 
            width: 100vw; 
            padding: 32px 20px; 
        } 
    }

  </style>
</head>
<body>

  <div class="auth-container">
    <div class="brand-panel">
      <div class="brand-hero-content">
        <div class="brand-icon-badge"><i class="fa-solid fa-key"></i></div>
        <h1>Account Recovery 🔒</h1>
        <p>Don't worry! Enter your registered business email and we will send you a password reset link.</p>
      </div>
      <div>&copy; 2026 SmartSeg. All rights reserved.</div>
    </div>

    <div class="form-panel">
      <a href="{{ url_for('home') }}" class="brand-logo-text"><i class="fa-solid fa-layer-group"></i> SmartSeg</a>

      <div class="form-header">
        <h2>Forgot Password?</h2>
        <p class="subtext">Enter your email address to recover access to your dashboard.</p>
      </div>

      <form action="{{ url_for('auth.forgot_password') }}" method="POST">
        <div class="form-group">
          <label for="email">Registered Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="name@company.com" required>
        </div>

        <button type="submit" class="btn-submit">Send Reset Link</button>
      </form>

      <a href="{{ url_for('auth.login') }}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
    </div>
  </div>

</body>
</html>
